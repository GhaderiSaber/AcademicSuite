name: CI

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verify Invariants & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce Directive 18 (Skill Modularity Ceilings)
        run: |
          python3 .agents/verification/skill_size_guard.py

      - name: Run Master Mathematical & Psychometric Test Suite
        run: |
          python3 run_tests.py
